name: Quick checks

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile core configuration
        run: python -m py_compile config.py
      - name: Run configuration tests
        run: python -m unittest discover -s tests -p "test_config.py"
